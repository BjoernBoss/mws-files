<div class="main-body" id="body">
	<div class="navigation" id="navigation">
		<div class="wrapper">
			<a class="button icon" id="button-parent"></a>
		</div>
	</div>

	<div class="content" id="content">
		<div id="content-empty" class="empty">Directory is empty</div>
		<div id="content-busy" class="busy">
			<div class="spinner"></div>
		</div>
	</div>

	<div class="notifications" id="notifications"></div>

	<div class="modify hidden" id="create-wrap">
		<div class="button" id="create-button"></div>
	</div>

	<div class="overlay hidden" id="menu-overlay">
		<div class="menu small">
			<div class="caption" id="menu-caption">
				<div class="name" id="menu-name"></div>
			</div>
			<div id="menu-content"></div>
			<div class="footer">
				<div class="button" id="menu-abort">Cancel</div>
			</div>
		</div>
	</div>

	<div class="overlay hidden" id="pick-overlay">
		<div class="menu large">
			<div class="caption navigation" id="pick-navigation">
				<div class="wrapper create">
					<div class="button icon" id="pick-create">
					</div>
				</div>
			</div>
			<div class="body">
				<div class="window">
					<div id="pick-content" class="list"></div>
					<div id="pick-content-empty" class="empty">Directory is empty</div>
				</div>
				<div class="busy hidden" id="pick-busy">
					<div class="spinner"></div>
				</div>
			</div>
			<div class="footer">
				<div class="button" id="pick-confirm">Confirm</div>
				<div class="button" id="pick-abort">Cancel</div>
			</div>
		</div>
	</div>

	<div class="overlay hidden" id="remove-overlay">
		<div class="dialog">
			<div class="caption">Do you want to permanently remove:</div>
			<div class="name" id="remove-name">SomeName</div>
			<div class="confirm">
				<div class="button" style="width: 100px;" id="remove-confirm">Remove</div>
				<div style="width: 15px;"></div>
				<div class="button" style="width: 100px;" id="remove-abort">Cancel</div>
			</div>
		</div>
	</div>

	<div class="drop-zone" id="drop-zone">
		Drop files here...<span class="detail" id="drop-detail"></span>
	</div>
</div>
