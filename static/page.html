<!doctype html>
<html style="height: 100%;">

<head>
	<title>Directory {#path}</title>
	<meta name="description" content="Content of directory {#path}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<style>
	:where(.main-body *) {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
	}

	.main-body {
		box-sizing: border-box;
		background-color: #f4f4f4;
		font-family: system-ui, sans-serif;
		color: #202020;
		width: 100%;
		height: 100%;
		padding: 1em;
		position: relative;
		display: flex;
		flex-direction: column;
	}

	/* buttons support [disabled] and [toggled] */
	.button {
		--button-animations: 100ms;
		transition: all var(--button-animations) ease;
	}

	.button.toggled {
		background-color: #00000040;
	}

	@media (hover: hover) {
		.button:not(.disabled):hover:not(:has(.button:hover)) {
			background-color: #00000018;
			cursor: pointer;
		}

		.button.toggled:not(.disabled):hover:not(:has(.button:hover)) {
			background-color: #00000058;
			cursor: pointer;
		}

	}

	.button:not(.disabled):active:not(:has(.button:hover)) {
		background-color: #00000030;
	}

	.button.toggled:not(.disabled):active:not(:has(.button:hover)) {
		background-color: #00000070;
	}

	.navigation {
		font-family: monospace;
		display: flex;
		flex-direction: row;
		gap: 0.75em;
	}

	.navigation .wrapper {
		border-radius: 5px;
		padding: 0.1em;
		overflow: auto hidden;
		background-color: #ffffff;
		max-width: fit-content;
		height: 100%;
		display: flex;
		flex-direction: row;
		align-items: center;
	}

	.navigation .icon {
		user-select: none;
		width: 1.25em;
	}

	.navigation .location {
		flex: 1;
		font-weight: bold;
	}

	.navigation .component {
		padding: 0.15em 0.75em;
		min-width: fit-content;
		border-radius: 3px;
		height: 100%;
		min-height: 1.8em;
		display: flex;
		align-items: center;
		white-space: nowrap;
	}

	.navigation .separator {
		background-color: #00000010;
		padding: 0.1em 0.2em;
		border-radius: 3px;
		margin: 0 0.1em;
		display: flex;
		align-items: center;
		height: 1.3em;
		user-select: none;
	}

	.horizontal-line {
		background-color: #00000030;
		height: 1px;
		border: none;
		margin: 1em 0;
	}

	.content {
		flex: 1;
		list-style: none;
		width: 100%;
		overflow: auto;
		--sep-margin: 0.5em;
	}

	.content .entry {
		height: 1.75em;
	}

	.content .entry+.entry {
		border-top: 1px solid #00000018;
	}

	.content .entry .icon {
		margin: 0 var(--sep-margin);
		user-select: none;
	}

	.content .entry .name {
		font-family: monospace;
		min-width: max-content;
		margin-right: var(--sep-margin);
	}

	.content .entry .details {
		font-family: monospace;
		font-size: 0.85em;
		min-width: max-content;
		color: #00000060;
		margin-right: var(--sep-margin);
	}

	.content .entry .option {
		margin: 3px var(--sep-margin) 3px 0;
		padding: 1px;
		border: 1px solid;
		border-radius: 3px;
		user-select: none;
		width: 1.5em;
		display: flex;
	}

	.content .entry .download {
		color: #00000060;
		margin-right: calc(var(--sep-margin) / 2);
	}

	.content .entry .delete {
		color: #d04040;
	}

	@media (hover: hover) {
		.delete.button:not(.disabled):hover:not(:has(.button:hover)) {
			background-color: #d04040;
			color: #e0e0e0;
		}
	}

	.delete.button:not(.disabled):active:not(:has(.button:hover)) {
		background-color: #b03030;
		color: #ffffff;
	}

	.drop-zone {
		border: 2px dashed #a0a0a0;
		border-radius: 8px;
		padding: 0.5em;
		text-align: center;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		color: #808080;
		user-select: none;
		--animation-time: 150ms;
	}

	.drop-zone .browse {
		color: #0070b0;
		cursor: pointer;
		text-decoration: underline;
	}

	.drop-zone .detail {
		font-size: 0.8em;
	}

	.drop-zone .browse:hover {
		color: #2098d8;
		cursor: pointer;
		text-decoration: underline;
	}

	.drop-zone.drop {
		position: absolute;
		width: calc(100% - 2em);
		bottom: 1em;
		z-index: 3;
		border-color: #0060b0;
		background-color: #e0f0ff;
		color: #0070b0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		height: 0;
		min-height: min-content;
		opacity: 0;
		pointer-events: none;
		transition: height var(--animation-time) ease,
			opacity var(--animation-time) calc(var(--animation-time) / 3);
	}

	.drop-zone.drop.expand {
		pointer-events: all;
		height: calc(100% - 2em);
		opacity: 1;
		transition: opacity var(--animation-time),
			height var(--animation-time) ease calc(var(--animation-time) / 3);
	}

	.overlay {
		z-index: 2;
		position: absolute;
		background-color: #00000060;
		width: 100%;
		height: 100%;
		left: 0;
		top: 0;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.dialog {
		border-radius: 6px;
		border: 1px solid #202020;
		background-color: #f0f0f0;
		display: flex;
		flex-direction: column;
		overflow: hidden;
		margin: 1em;
	}

	.dialog .caption {
		font-size: 1.3em;
		margin: 15px 20px;
		user-select: none;
	}

	.dialog .name {
		font-size: 1.2em;
		font-family: monospace;
		margin: 0 20px 20px;
	}

	.dialog .confirm {
		display: flex;
		justify-content: end;
		background-color: #c0c0c0;
		padding: 15px;
	}

	.dialog .confirm .button {
		user-select: none;
		border-radius: 4px;
		background-color: #ffffff;
		border: 1px solid black;
		padding: 1px 0px 3px;
		box-shadow: 0 0 3px black;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 1.2em;
	}

	.notifications {
		position: absolute;
		width: 100%;
		height: 100%;
		right: 0;
		top: 0;
		z-index: 1;
		user-select: none;
		display: flex;
		flex-direction: column;
		align-items: end;
		padding: 0.5em;
		overflow: hidden auto;
		pointer-events: none;
		gap: 0.5em;
	}

	.notifications .entry {
		max-width: 100%;
		border: 1.5px solid #808080;
		background-color: white;
		padding: 6px;
		border-radius: 4px;
		display: flex;
		align-items: center;
		pointer-events: all;
		overflow: hidden;
	}

	.notifications .entry>.button {
		border: 1px solid black;
		border-radius: 2px;
		box-shadow: 0 0 2px black;
		display: flex;
		justify-content: center;
		align-items: center;
		height: min-content;
		margin: 4px;
		margin-left: 0.75em;
		padding: 2px;
		width: 1.3em;
		height: 1.3em;
	}

	.notifications .entry>.content {
		padding-left: 0.25em;
		flex: 1;
		min-width: 0;
		width: max-content;
		overflow: hidden;
		user-select: text;
	}

	.upload {
		font-family: monospace;
		display: flex;
		flex-direction: column;
		align-items: end;
		gap: 0.25em;
	}

	.upload .text {
		font-size: 0.85em;
		text-overflow: ellipsis;
		white-space: nowrap;
		overflow: hidden;
		width: 100%;
	}

	.upload .status {
		display: flex;
		align-items: center;
		width: 100%;
		max-width: max-content;
	}

	.upload .bar {
		width: 120px;
		height: 8px;
		background: #d0d0d0;
		border-radius: 4px;
		overflow: hidden;
	}

	.upload .fill {
		height: 100%;
		background: #0060c0;
		transition: width 200ms;
		width: 0%;
	}

	.upload .state {
		color: #0060c0;
		text-align: end;
	}

	.upload .progress {
		width: 2.5em;
		margin-left: 0.5em;
		padding-right: 0.25em;
		font-size: 0.9em;
	}

	.load-icon {
		display: flex;
		width: 100%;
		height: 100%;
		font-size: 0.75em;
		overflow: hidden;
	}
</style>

<body style="margin: 0; height: 100%;">
	<div class="main-body" id="body">
		<div class="navigation">
			<div class="wrapper">
				<div class="component button">
					<div class="icon" id="icon-parent">
					</div>
				</div>
			</div>
			<div class="wrapper location" id="location">
				<div class="component button">
					<div class="icon" id="icon-home">
					</div>
				</div>
				<div class="separator">/</div>
				<div class="component button">First Entry</div>
				<div class="separator">/</div>
				<div class="component button">Second</div>
				<div class="separator">/</div>
				<div class="component button">Third</div>
			</div>
		</div>

		<hr class="horizontal-line" />

		<div class="content">
			<table style="border-collapse: collapse;">
				<colgroup>
					<col style="width: 0.001%;" />
					<col style="width: auto;" />
					<col style="width: 0.001%;" />
					<col style="width: 0.001%;" />
					<col style="width: 0.001%;" />
				</colgroup>
				<tbody id="content">
				</tbody>
			</table>
		</div>

		<hr class="horizontal-line" id="drop-line" style="display: none;" />

		<div class="drop-zone" id="drop-visual" style="display: none;">
			Drop files here or <span class="browse" id="browse-files">browse</span>
			<br /><span class="detail" id="drop-visual-detail"></span>
			<input type="file" style="display: none;" id="file-input" multiple />
		</div>

		<div class="drop-zone drop" id="drop-zone">
			Drop files here<span class="detail" id="drop-detail"></span>
		</div>

		<div class="overlay" style="display: none;" id="remove-dialog">
			<div class="dialog">
				<div class="caption">Do you want to permanently remove:</div>
				<div class="name" id="remove-name">SomeName</div>
				<div class="confirm">
					<div class="button" style="width: 100px;" id="remove-confirm">Remove</div>
					<div style="width: 15px;"></div>
					<div class="button" style="width: 100px;" id="remove-abort">Cancel</div>
				</div>
			</div>
		</div>

		<div class="notifications" id="notifications">
		</div>
	</div>
	<script>
		const REMOVE_NOTIFICATION_ANIMATION = 25;
		const FADE_NOTIFICATION_ANIMATION = 3500;
		const COLOR_UI_SUCCESS = '#30a080';
		const COLOR_UI_ERROR = '#b05050';
		const _state = { list: [], loadedIcons: {} };

		_state.manifest = {
			canDelete: true,
			canUpload: true,
			maxUploadSize: 50_000,
			basePath: ''
		};

		const INITIAL_LIST = [
			{ directory: true, name: 'Directory', details: 0 },
			{ directory: true, name: 'Folder', details: 50 },
			{ directory: false, name: 'empty.txt', details: 1231241232419 },
			{ directory: false, name: 'hello, world.txt', details: 914312032184 },
			{ directory: false, name: 'This is a very short file.txt', details: 20 },
			{ directory: false, name: 'This is a very long file.txt', details: 20_000_000_000 },
		];

		_state.loadIcon = (placeholder, path) => {
			/* load the icons manually to ensure they are placed in-place and can be CSS modified */
			const element = document.createElement('div');
			element.classList.add('load-icon');

			let entry = _state.loadedIcons[path] ?? null;

			if (entry != null && entry.content != null) {
				element.innerHTML = entry.content;
				return element;
			}

			/* check if this is the initial request and trigger the fetch */
			if (entry == null) {
				entry = (_state.loadedIcons[path] = {
					content: null,
					resolved: false,
					queue: []
				});

				fetch(path).then((resp) => {
					if (!resp.ok)
						throw 0;
					return resp.text();
				}).then((content) => {
					entry.resolved = true;
					entry.content = content;
					for (const elem of entry.queue)
						elem.innerHTML = entry.content;
					entry.queue = [];
				}).catch(() => {
					entry.resolved = true;
					entry.queue = [];
				});
			}

			/* mark the element to be interested in the icon and setup the initial placeholder */
			if (!entry.resolved)
				entry.queue.push(element);
			element.innerHTML = placeholder;
			return element;
		}

		_state.pushNotification = (body) => {
			const host = document.getElementById('notifications');

			/* setup the close icon and ensure that failure is logged as few times as
			*	possible (as every notification would otherwise trigger the failure log) */
			const close = document.createElement('div');
			close.classList.add('button');
			close.appendChild(_state.loadIcon('Close', './close-icon.svg'));

			const entry = document.createElement('div');
			entry.classList.add('entry');

			const content = document.createElement('div');
			content.classList.add('content');
			content.appendChild(body);

			entry.appendChild(content);
			entry.appendChild(close);

			host.appendChild(entry);

			/* register the animated close handler and the phase-out handler */
			let faded = false, closed = false;
			close.onclick = () => {
				if (closed) return; closed = true;

				/* manually animate, due to unknown initial height */
				entry.animate([
					{ height: `${entry.clientHeight}px`, easing: 'ease-in' },
					{ height: '0', paddingTop: '0', paddingBottom: '0' }
				], REMOVE_NOTIFICATION_ANIMATION);
				setTimeout(() => host.removeChild(entry), REMOVE_NOTIFICATION_ANIMATION);
			};
			return (fast) => {
				if (fast) {
					close.onclick();
					return;
				}
				if (faded || closed) return; faded = true;

				/* manually animate, in case of immediate fade-out (as first now created, is applied instantly) */
				entry.animate([
					{ opacity: '1', easing: 'ease-in' },
					{ opacity: '0.25' }
				], FADE_NOTIFICATION_ANIMATION);
				setTimeout(() => close.onclick(), FADE_NOTIFICATION_ANIMATION);
			};
		}

		_state.makeUploadProgress = (caption) => {
			const upload = document.createElement('div');
			upload.classList.add('upload');

			const name = document.createElement('div');
			name.innerText = caption;
			name.classList.add('text');

			const htmlStatus = document.createElement('div');
			htmlStatus.classList.add('status');

			upload.appendChild(name);
			upload.appendChild(htmlStatus);

			const bar = document.createElement('div');
			bar.classList.add('bar');
			const fill = document.createElement('div');
			fill.classList.add('fill');
			bar.appendChild(fill);

			const textProgress = document.createElement('div');
			textProgress.classList.add('progress', 'state');
			textProgress.innerText = '0%';

			htmlStatus.appendChild(bar);
			htmlStatus.appendChild(textProgress);

			/* setup the callback to report progress and success/failure */
			const callback = (detail, status) => {
				if (status == null) {
					const value = `${Math.round(detail * 100)}%`;
					fill.style.width = value;
					textProgress.innerText = value;
					return;
				}

				htmlStatus.removeChild(bar)
				textProgress.classList.remove('progress');
				textProgress.classList.add('text');
				textProgress.style.color = (status ? COLOR_UI_SUCCESS : COLOR_UI_ERROR);
				textProgress.innerHTML = detail;
			};
			return [upload, callback];
		}
		_state.makeDelayedStatus = (caption) => {
			const upload = document.createElement('div');
			upload.classList.add('upload');

			const name = document.createElement('div');
			name.innerText = caption;
			name.classList.add('text');

			const textStatus = document.createElement('div');
			textStatus.innerText = '...';
			textStatus.classList.add('text', 'state');

			upload.appendChild(name);
			upload.appendChild(textStatus);

			/* setup the callback to report progress and success/failure */
			const callback = (detail, status) => {
				textStatus.innerText = detail;
				if (status != null)
					textStatus.style.color = (status ? COLOR_UI_SUCCESS : COLOR_UI_ERROR);
			};
			return [upload, callback];
		}
		_state.makeStaticText = (text, status) => {
			const element = document.createElement('div');
			element.innerText = text;
			if (status != null)
				element.style.color = (status ? COLOR_UI_SUCCESS : COLOR_UI_ERROR);
			return element;
		}

		_state.uploadFile = (file, fileName, fileSize) => {
			if (!_state.manifest.canUpload) {
				_state.pushNotification(_state.makeStaticText('Not allowed to upload content', false));
				return;
			}
			console.log(`uploading [${fileName}] of size [${fileSize}]...`);

			const [element, update] = _state.makeUploadProgress(`Upload: ${fileName}`);
			const fadeOut = _state.pushNotification(element);
			if (fileSize > _state.manifest.maxUploadSize)
				return update(`Too large [${_state.formatSize(fileSize)}]`, false);
			update(0, null);

			const xhr = new XMLHttpRequest();
			xhr.open('POST', `${_state.manifest.basePath}/${encodeURIComponent(fileName)}`, true);
			xhr.upload.onprogress = (e) => {
				update(e.loaded / fileSize, null);
			};
			xhr.onload = () => {
				if (xhr.status < 200 || xhr.status >= 300)
					return update(`Error: ${xhr.statusText}`, false);

				/* add the entry preemtively to the list */
				_state.updateList(_state.list.concat([{ name: fileName, directory: false, details: fileSize }]));
				update('Uploaded!', true);
				fadeOut();
			};
			xhr.onerror = () => update('Network error', false);
			xhr.send(file);
		}
		_state.removeFile = (name) => {
			if (!_state.manifest.canDelete) {
				_state.pushNotification(_state.makeStaticText('Not allowed to remove content', false));
				return;
			}
			console.log(`confirming removing [${name}]...`);
			document.getElementById('remove-name').innerText = name;
			document.getElementById('remove-dialog').style.display = 'flex';

			document.getElementById('remove-confirm').onclick = () => {
				console.log(`removing [${name}]...`);
				document.getElementById('remove-dialog').style.display = 'none';

				const [element, update] = _state.makeDelayedStatus(`Remove: ${name}`);
				const fadeOut = _state.pushNotification(element);
				update('Removing...', null);

				fetch(`${_state.manifest.basePath}/${encodeURIComponent(name)}`, { method: 'DELETE' })
					.then((resp) => {
						if (!resp.ok)
							return update(`Error: ${resp.statusText}`, false);

						/* remove the entry preemptively from the list */
						_state.updateList(_state.list.filter((entry) => entry.name != name));
						update(`Removed!`, true)
						fadeOut();
					})
					.catch(() => update('Network error', false));
			};
		}

		_state.formatSize = (size) => {
			for (const option of [[1_000_000_000_000_000, 'P'], [1_000_000_000_000, 'T'], [1_000_000_000, 'G'], [1_000_000, 'M'], [1_000, 'K'], [1, '']]) {
				if (size < option[0] && option[0] > 0)
					continue;
				if (option[1] == '')
					return `${size} Bytes`;
				size /= option[0];
				if (size > 1000)
					return `${Math.round(size)} ${option[1]}B`;
				else
					return `${(size).toPrecision(3)} ${option[1]}B`;
			}
		}
		_state.updateList = (content) => {
			const host = document.getElementById('content');

			/* sort the content according to the presentation order */
			const compare = (a, b) => {
				if (a.directory != b.directory)
					return (a.directory ? -1 : 1);
				return (a.name < b.name ? -1 : (a.name == b.name ? 0 : 1));
			};
			content.sort(compare);

			/* iterate over the current list and content list, and synchronize them */
			let prev = 0, next = 0;
			while (true) {
				const hasPrev = (prev < _state.list.length), hasNext = (next < content.length);
				if (!hasPrev && !hasNext)
					break;
				const cmp = (hasNext ? (hasPrev ? compare(_state.list[prev], content[next]) : 1) : -1);

				/* check if an entry needs to be removed */
				if (cmp < 0) {
					host.removeChild(_state.list[prev].html);
					_state.list.splice(prev, 1);
					continue;
				}

				/* check if an entry needs to be added */
				if (cmp > 0) {
					const row = document.createElement('tr');
					row.classList.add('entry', 'button');

					const _icon = document.createElement('div');
					_icon.classList.add('icon');
					_icon.innerText = (content[next].directory ? '\uD83D\uDCC1' : '\uD83D\uDCC4');
					const icon = document.createElement('td');
					icon.appendChild(_icon);

					const _name = document.createElement('div');
					_name.classList.add('name');
					_name.innerText = content[next].name;
					const name = document.createElement('td');
					name.appendChild(_name);

					const _details = document.createElement('div');
					_details.classList.add('details');
					_details.innerText = 'none';
					const details = document.createElement('td');
					details.appendChild(_details);

					const _download = document.createElement('div');
					_download.classList.add('download', 'button', 'option');
					_download.appendChild(_state.loadIcon('Download', './download-icon.svg'));
					const download = document.createElement('td');
					download.appendChild(_download);

					const remove = document.createElement('td');
					if (_state.manifest.canDelete) {
						const _remove = document.createElement('div');
						_remove.classList.add('delete', 'button', 'option');
						_remove.appendChild(_state.loadIcon('Delete', './delete-icon.svg'));
						remove.appendChild(_remove);
					}

					row.appendChild(icon);
					row.appendChild(name);
					row.appendChild(details);
					row.appendChild(download);
					row.appendChild(remove);

					host.insertBefore(row, (hasPrev ? _state.list[prev].html : null));
					_state.list.splice(prev, 0, { directory: content[next].directory, name: content[next].name, html: row });
				}

				/* patch details up accordingly (must now exist in both lists, as either matched or newly created) */
				const entry = _state.list[prev];
				entry.details = content[next].details;
				if (content[next].directory)
					entry.html.children[2].children[0].innerText = `${content[next].details} Items`;
				else
					entry.html.children[2].children[0].innerText = _state.formatSize(content[next].details);

				/* patch the remove button */
				if (_state.manifest.canDelete)
					entry.html.children[4].children[0].onclick = () => _state.removeFile(entry.name);
				++next, ++prev;
			}
			console.log('content list has been updated...');
		}

		window.onload = () => {
			/* register the location listener to ensure the location is scroll end-favoring
			*	(to preserve the closer parents on small views; initialize for initial load) */
			const location = document.getElementById('location');
			let lastWidth = location.clientWidth;
			location.scrollLeft = location.scrollWidth - lastWidth;
			new ResizeObserver(() => {
				const width = location.clientWidth;
				if (width < lastWidth && location.scrollLeft + lastWidth >= location.scrollWidth)
					location.scrollLeft = location.scrollWidth - width;
				lastWidth = width;
			}).observe(location);

			/* setup the parent and home icons */
			document.getElementById('icon-parent').appendChild(_state.loadIcon('Parent', './back-icon.svg'));
			document.getElementById('icon-home').appendChild(_state.loadIcon('Home', './home-icon.svg'));

			/* register the drag-and-drop handlers for the UI */
			if (_state.manifest.canUpload) {
				const dropDetector = document.getElementById('body');
				const dropZone = document.getElementById('drop-zone');
				let dropCountDepth = 0;
				dropDetector.ondragenter = (e) => {
					e.preventDefault();
					if (dropCountDepth++ == 0)
						dropZone.classList.add('expand');
				};
				dropDetector.ondragleave = (e) => {
					e.preventDefault();
					if (dropCountDepth > 0 && --dropCountDepth == 0)
						dropZone.classList.remove('expand');
				};
				dropDetector.ondragend = (e) => {
					dropCountDepth = 0;
					dropZone.classList.remove('expand');
				};
				dropDetector.ondragover = (e) => e.preventDefault();
				dropDetector.ondrop = (e) => {
					e.preventDefault();
					dropCountDepth = 0;
					dropZone.classList.remove('expand');
					for (const item of e.dataTransfer.items) {
						const entry = item.webkitGetAsEntry();
						const file = item.getAsFile();
						if (entry != null && entry.isFile && file != null)
							_state.uploadFile(file, file.name, file.size);
					}
				};

				/* patch the browse to file-input dialog flow */
				const fileInput = document.getElementById('file-input');
				document.getElementById('browse-files').onclick = () => fileInput.click();
				fileInput.onchange = () => {
					for (const file of fileInput.files)
						_state.uploadFile(file, file.name, file.size);
					fileInput.value = '';
				};

				/* actually present the drop content and add the size constraints */
				document.getElementById('drop-line').style.display = 'unset';
				document.getElementById('drop-visual').style.display = 'unset';
				if (_state.manifest.maxUploadSize != null) {
					const text = `(Max. ${_state.formatSize(_state.manifest.maxUploadSize)})`;
					document.getElementById('drop-detail').innerHTML = text;
					document.getElementById('drop-visual-detail').innerHTML = text;
				}
			}

			/* register all relevant delete dialog handler */
			const removeDialog = document.getElementById('remove-dialog');
			removeDialog.children[0].onmousedown = (e) => {
				e.stopPropagation();
			};
			removeDialog.onmousedown = (e) => {
				e.preventDefault();
				removeDialog.style.display = 'none';
			};
			document.getElementById('remove-abort').onclick = () => {
				removeDialog.style.display = 'none';
			};
		}

		_state.updateList(INITIAL_LIST);
	</script>
</body>

</html>
